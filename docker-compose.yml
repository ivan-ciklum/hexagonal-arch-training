version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clubexample-postgres
    environment:
      POSTGRES_DB: clubexample
      POSTGRES_USER: clubuser
      POSTGRES_PASSWORD: clubpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed-data:/docker-entrypoint-initdb.d
    networks:
      - clubexample-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clubexample-redis
    ports:
      - "6379:6379"
    networks:
      - clubexample-network
    restart: unless-stopped

  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: clubexample-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"  # Pulsar broker
      - "8080:8080"  # Pulsar admin API
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m"
    networks:
      - clubexample-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  clubexample-network:
    driver: bridge