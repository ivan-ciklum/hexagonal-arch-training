version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clubexample-postgres
    environment:
      POSTGRES_DB: clubexample
      POSTGRES_USER: clubuser
      POSTGRES_PASSWORD: clubpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed-data:/docker-entrypoint-initdb.d
    networks:
      - clubexample-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clubexample-redis
    ports:
      - "6379:6379"
    networks:
      - clubexample-network
    restart: unless-stopped

  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: clubexample-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"  # Pulsar broker
      - "8080:8080"  # Pulsar admin API
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m"
    networks:
      - clubexample-network
    restart: unless-stopped

  host-write:
    build:
      context: .
      dockerfile: src/Host.Write/Dockerfile
    container_name: clubexample-host-write
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__ClubDatabase=Host=postgres;Database=clubexample;Username=clubuser;Password=clubpass123
      - ConnectionStrings__Redis=redis:6379
      - Pulsar__ServiceUrl=pulsar://pulsar:6650
    ports:
      - "5001:5000"  # Write host on port 5001
    depends_on:
      - postgres
      - redis
      - pulsar
    networks:
      - clubexample-network
    restart: unless-stopped

  host-read-1:
    build:
      context: .
      dockerfile: src/Host.Read/Dockerfile
    container_name: clubexample-host-read-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__ClubDatabase=Host=postgres;Database=clubexample;Username=clubuser;Password=clubpass123
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5002:5000"  # Read host instance 1 on port 5002
    depends_on:
      - postgres
      - redis
    networks:
      - clubexample-network
    restart: unless-stopped

  host-read-2:
    build:
      context: .
      dockerfile: src/Host.Read/Dockerfile
    container_name: clubexample-host-read-2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__ClubDatabase=Host=postgres;Database=clubexample;Username=clubuser;Password=clubpass123
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5003:5000"  # Read host instance 2 on port 5003
    depends_on:
      - postgres
      - redis
    networks:
      - clubexample-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  clubexample-network:
    driver: bridge