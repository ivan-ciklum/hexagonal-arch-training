version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clubexample-postgres
    environment:
      POSTGRES_DB: clubexample
      POSTGRES_USER: clubuser
      POSTGRES_PASSWORD: clubpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed-data:/docker-entrypoint-initdb.d
    networks:
      - clubexample-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubuser -d clubexample"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: clubexample-redis
    ports:
      - "6379:6379"
    networks:
      - clubexample-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: clubexample-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"  # Pulsar broker
      - "8080:8080"  # Pulsar admin API
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m"
    networks:
      - clubexample-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/clusters"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Aspire Dashboard - OpenTelemetry Collector and UI
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: clubexample-aspire-dashboard
    ports:
      - "18888:18888"  # Dashboard UI
      - "18889:18889"  # OTLP gRPC endpoint
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - ASPNETCORE_URLS=http://+:18888
      - DOTNET_DASHBOARD_OTLP_ENDPOINT_URL=http://+:18889
    networks:
      - clubexample-network
    restart: unless-stopped

  # Write API - Instance 1
  host-write-1:
    build:
      context: .
      dockerfile: src/Host.Write/Dockerfile
    container_name: clubexample-host-write-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - INSTANCE_NAME=Write-Instance-1
      - ConnectionStrings__ClubDatabase=Host=postgres;Database=clubexample;Username=clubuser;Password=clubpass123
      - ConnectionStrings__Redis=redis:6379
      - Pulsar__ServiceUrl=pulsar://pulsar:6650
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    networks:
      - clubexample-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulsar:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Write API - Instance 2
  host-write-2:
    build:
      context: .
      dockerfile: src/Host.Write/Dockerfile
    container_name: clubexample-host-write-2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - INSTANCE_NAME=Write-Instance-2
      - ConnectionStrings__ClubDatabase=Host=postgres;Database=clubexample;Username=clubuser;Password=clubpass123
      - ConnectionStrings__Redis=redis:6379
      - Pulsar__ServiceUrl=pulsar://pulsar:6650
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    networks:
      - clubexample-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulsar:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Read API - Instance 1
  host-read-1:
    build:
      context: .
      dockerfile: src/Host.Read/Dockerfile
    container_name: clubexample-host-read-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - INSTANCE_NAME=Read-Instance-1
      - ConnectionStrings__ClubDatabase=Host=postgres;Database=clubexample;Username=clubuser;Password=clubpass123
      - ConnectionStrings__Redis=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    networks:
      - clubexample-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Read API - Instance 2
  host-read-2:
    build:
      context: .
      dockerfile: src/Host.Read/Dockerfile
    container_name: clubexample-host-read-2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - INSTANCE_NAME=Read-Instance-2
      - ConnectionStrings__ClubDatabase=Host=postgres;Database=clubexample;Username=clubuser;Password=clubpass123
      - ConnectionStrings__Redis=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    networks:
      - clubexample-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Reverse Proxy - API Gateway
  reverse-proxy:
    build:
      context: .
      dockerfile: src/Host.ReverseProxy/Dockerfile
    container_name: clubexample-reverse-proxy
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    ports:
      - "5000:80"  # Main entry point for all traffic
    networks:
      - clubexample-network
    depends_on:
      host-write-1:
        condition: service_healthy
      host-write-2:
        condition: service_healthy
      host-read-1:
        condition: service_healthy
      host-read-2:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
    driver: local

networks:
  clubexample-network:
    driver: bridge